<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#040b18" />
  <meta name="description" content="Mix Armor Sets and Legendaries in Cave Diver to preview live stat effects, set bonuses, and outfitted divers." />
  <title>Cave Diver — Sets &amp; Legendaries Mixer</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg?v=290" />
  <link rel="stylesheet" href="./codex.css?v=290" />
</head>
<body>
  <header class="codex-topbar">
    <div class="codex-topbar-inner">
      <div class="codex-brand-group">
        <a id="codex-back-link" class="codex-back-btn" href="./index.html" title="Return to Cave Diver">
          ← Back
        </a>
        <h1 class="codex-title">📖 Sets &amp; Legendaries</h1>
      </div>
      <div class="codex-quick-presets" aria-label="Quick Rig Presets">
        <button id="btn-codex-test-dive" class="codex-btn emerald" type="button" title="Swim &amp; test this exact build live in Proving Grounds">🏊 Test in Water</button>
        <button id="btn-codex-all-legendary" class="codex-btn gold" type="button" title="Equip all 9 Legendaries in preview">🔥 All 9 Legendaries</button>
        <button id="btn-codex-reset-preview" class="codex-btn ghost" type="button" title="Load your saved dive rig">↺ My Rig</button>
        <button id="btn-codex-clear-mix" class="codex-btn ghost" type="button" title="Reset all slots to stock baseline">✕ Clear</button>
      </div>
    </div>
  </header>

  <main class="codex-shell">
    <aside id="codex-preview-sidebar" class="codex-preview-sidebar" aria-label="Live Build &amp; Stat Effects">
      <div class="codex-preview-top">
        <div class="codex-preview-stage">
          <canvas id="codex-preview-canvas" width="960" height="360" aria-label="Animated diver rig preview"></canvas>
          <div class="codex-preview-caption">
            <span id="codex-preview-label" class="codex-preview-label">Your Dive Rig</span>
          </div>
        </div>
        <div id="codex-preview-bars" class="codex-stat-bars" aria-label="Live Mixed Rig Stat Meters"></div>
      </div>

      <div class="codex-preview-bottom">
        <div id="codex-preview-synergies" class="codex-synergies-row" aria-label="Active Set Bonuses and Powers"></div>
        <div id="codex-preview-slots" class="codex-equipped-slots" aria-label="Active Mixed Gear Slots"></div>
        <div id="codex-saved-builds" class="codex-saved-builds" aria-label="Saved Custom Hybrid Builds">
          <button id="btn-codex-save-build" class="codex-build-save-btn" type="button" title="Save current mixed build as a quick preset">⭐ Save Mix</button>
          <div id="codex-saved-builds-list" class="codex-saved-builds-list"></div>
        </div>
        <button id="btn-codex-equip-rig" class="codex-btn primary codex-equip-cta" type="button" hidden>⚡ Equip Owned to My Rig</button>
      </div>
    </aside>

    <section class="codex-main-col" aria-label="Mix Armor Sets and Legendaries">
      <div class="codex-toolbar">
        <div class="codex-tabs" role="tablist" aria-label="Gear Categories">
          <button type="button" role="tab" class="codex-tab active" data-tab="sets" aria-selected="true">
            ✨ Armor Sets <span id="tab-count-sets" class="codex-tab-count">8</span>
          </button>
          <button type="button" role="tab" class="codex-tab" data-tab="legendaries" aria-selected="false">
            🔥 Legendaries <span id="tab-count-legendaries" class="codex-tab-count">9</span>
          </button>
        </div>

        <div class="codex-toolbar-right">
          <label class="codex-search-wrap" aria-label="Filter sets, pieces, or stats">
            <span class="codex-search-icon" aria-hidden="true">🔎</span>
            <input id="codex-search" class="codex-search-input" type="search" placeholder="Filter by stat, slot, name..." autocomplete="off" />
          </label>
          <button id="btn-codex-owned-toggle" type="button" class="codex-owned-toggle" aria-pressed="false" title="Show only unlocked gear">
            ✓ Owned
          </button>
        </div>
      </div>

      <div id="codex-content" aria-live="polite"></div>
    </section>
  </main>

  <div id="codex-toast" class="codex-toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/ui/gearCodexPage.js?v=290"></script>
</body>
</html>
