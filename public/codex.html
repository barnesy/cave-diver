<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#040b18" />
  <meta name="description" content="Explore all Armor Sets and Ultra-Rare Legendaries in Cave Diver with a live diver rig preview." />
  <title>Cave Diver — Sets &amp; Legendaries Codex</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg?v=273" />
  <link rel="stylesheet" href="./codex.css?v=273" />
</head>
<body>
  <header class="codex-topbar">
    <div class="codex-topbar-inner">
      <div class="codex-brand-group">
        <a id="codex-back-link" class="codex-back-btn" href="./index.html" title="Return to Cave Diver">
          ← Back
        </a>
        <h1 class="codex-title">📖 Sets &amp; Legendaries</h1>
      </div>
      <div class="codex-summary" aria-label="Collection Progress">
        <span id="codex-sum-sets" class="codex-progress-chip sets">Sets 0/8</span>
        <span id="codex-sum-legendaries" class="codex-progress-chip legendaries">Legendaries 0/9</span>
      </div>
    </div>
  </header>

  <main class="codex-shell">
    <section class="codex-main-col" aria-label="Sets and Legendaries Explorer">
      <div class="codex-toolbar">
        <div class="codex-tabs" role="tablist" aria-label="Codex Sections">
          <button type="button" role="tab" class="codex-tab active" data-tab="sets" aria-selected="true">
            ✨ Armor Sets <span id="tab-count-sets" class="codex-tab-count">8</span>
          </button>
          <button type="button" role="tab" class="codex-tab" data-tab="legendaries" aria-selected="false">
            🔥 Legendaries <span id="tab-count-legendaries" class="codex-tab-count">9</span>
          </button>
        </div>

        <div class="codex-toolbar-right">
          <label class="codex-search-wrap" aria-label="Search sets, pieces, powers, or stats">
            <span class="codex-search-icon" aria-hidden="true">🔎</span>
            <input id="codex-search" class="codex-search-input" type="search" placeholder="Search sets, pieces, powers..." autocomplete="off" />
          </label>
          <button id="btn-codex-owned-toggle" type="button" class="codex-owned-toggle" aria-pressed="false" title="Show only items you have unlocked">
            ✓ Owned
          </button>
        </div>
      </div>

      <div id="codex-content" aria-live="polite"></div>
    </section>

    <aside class="codex-preview-sidebar" aria-label="Live Diver Rig Preview">
      <div class="codex-preview-head">
        <h2 class="codex-preview-title">Live Preview</h2>
        <button id="btn-codex-all-legendary" class="codex-btn gold" type="button" title="Preview all 9 Ultra-Rare Legendaries equipped together">🔥 All 9 Legendaries</button>
      </div>

      <div class="codex-preview-stage">
        <canvas id="codex-preview-canvas" width="760" height="400" aria-label="Animated diver rig preview"></canvas>
        <div class="codex-preview-caption">
          <span id="codex-preview-label" class="codex-preview-label">Your Dive Rig</span>
        </div>
      </div>

      <div class="codex-preview-body">
        <div id="codex-preview-bonus" class="codex-preview-bonus"></div>
        <div id="codex-preview-perf" class="codex-perf-grid" aria-label="Preview Rig Stats"></div>
        <div id="codex-preview-slots" class="codex-equipped-slots" aria-label="Previewed Gear Pieces"></div>
        <div class="codex-preview-actions">
          <button id="btn-codex-equip-rig" class="codex-btn primary" type="button" hidden>⚡ Equip Owned to My Rig</button>
          <button id="btn-codex-reset-preview" class="codex-btn ghost" type="button">↺ Reset to My Rig</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="codex-toast" class="codex-toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/ui/gearCodexPage.js?v=273"></script>
</body>
</html>
